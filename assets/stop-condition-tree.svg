<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580">
  <rect width="760" height="580" fill="#0d1117"/>
  
  <text x="380" y="30" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Stop Condition Decision Tree</text>
  <text x="380" y="50" font-size="11" fill="#8b949e" text-anchor="middle">Define done before you start. Evidence > confidence.</text>
  
  <!-- Start node -->
  <rect x="230" y="60" width="300" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="380" y="90" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">START: Write Your Stop Condition</text>
  <text x="380" y="108" font-size="9" fill="#8b949e" text-anchor="middle">Before you run the prompt, define done in one sentence</text>
  
  <path d="M 380 115 L 380 145" stroke="#58a6ff" stroke-width="3" fill="none"/>
  <polygon points="375,155 380,165 385,155" fill="#58a6ff"/>
  
  <!-- Q1: Observable -->
  <rect x="130" y="160" width="500" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="380" y="185" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">Q1: Is it OBSERVABLE?</text>
  <text x="380" y="200" font-size="10" fill="#c9d1d9" text-anchor="middle">Could someone else verify it without reading your mind?</text>
  <text x="380" y="213" font-size="8" fill="#8b949e" text-anchor="middle">Yes = every claim has a source | No = looks good to me</text>
  
  <!-- YES branch -->
  <path d="M 130 225 L 60 225" stroke="#7ee787" stroke-width="3" fill="none"/>
  <polygon points="65,220 60,230 65,230" fill="#7ee787"/>
  <rect x="10" y="215" width="50" height="25" rx="5" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="35" y="238" font-size="8" font-weight="bold" fill="#7ee787" text-anchor="middle">YES</text>
  
  <!-- NO branch -->
  <path d="M 650 225 L 700 225" stroke="#f78166" stroke-width="3" fill="none"/>
  <polygon points="695,220 700,230 695,230" fill="#f78166"/>
  <rect x="705" y="215" width="50" height="25" rx="5" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="730" y="238" font-size="8" font-weight="bold" fill="#f78166" text-anchor="middle">NO</text>
  
  <rect x="705" y="260" width="50" height="45" rx="8" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="730" y="282" font-size="8" font-weight="bold" fill="#f78166" text-anchor="middle">REWRITE</text>
  <text x="730" y="300" font-size="7" fill="#8b949e" text-anchor="middle">Make it</text>
  <text x="730" y="310" font-size="7" fill="#8b949e" text-anchor="middle">observable</text>
  <path d="M 730 280 L 730 310 L 380 310 L 380 160" stroke="#f78166" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  
  <path d="M 380 225 L 380 275" stroke="#7ee787" stroke-width="3" fill="none"/>
  
  <!-- Q2: Falsifiable -->
  <rect x="130" y="290" width="500" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="380" y="315" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">Q2: Is it FALSIFIABLE?</text>
  <text x="380" y="333" font-size="10" fill="#c9d1d9" text-anchor="middle">Can you clearly FAIL it? (Not good tone - that passes everything)</text>
  <text x="380" y="346" font-size="8" fill="#8b949e" text-anchor="middle">Yes = every number traces to a doc | No = feels right</text>
  
  <path d="M 130 355 L 60 355" stroke="#7ee787" stroke-width="3" fill="none"/>
  <polygon points="65,350 60,360 65,360" fill="#7ee787"/>
  <rect x="10" y="345" width="50" height="25" rx="5" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="35" y="363" font-size="8" font-weight="bold" fill="#7ee787" text-anchor="middle">YES</text>
  
  <path d="M 650 355 L 700 355" stroke="#f78166" stroke-width="3" fill="none"/>
  <polygon points="695,350 700,360 695,360" fill="#f78166"/>
  <rect x="705" y="345" width="50" height="25" rx="5" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="730" y="363" font-size="8" font-weight="bold" fill="#f78166" text-anchor="middle">NO</text>
  
  <rect x="705" y="390" width="50" height="45" rx="8" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="730" y="412" font-size="8" font-weight="bold" fill="#f78166" text-anchor="middle">REWRITE</text>
  <text x="730" y="430" font-size="7" fill="#8b949e" text-anchor="middle">Add fail</text>
  <text x="730" y="440" font-size="7" fill="#8b949e" text-anchor="middle">condition</text>
  <path d="M 730 410 L 730 440 L 380 440 L 380 290" stroke="#f78166" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  
  <path d="M 380 355 L 380 405" stroke="#7ee787" stroke-width="3" fill="none"/>
  
  <!-- Q3: Real Risk -->
  <rect x="130" y="420" width="500" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="380" y="345" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">Q3: Does It Target the REAL RISK?</text>
  <text x="380" y="363" font-size="10" fill="#c9d1d9" text-anchor="middle">Not a proxy. What actually goes wrong if you stop too early/late?</text>
  <text x="380" y="376" font-size="8" fill="#8b949e" text-anchor="middle">Yes = catches real failure mode | No = proxy metric</text>
  
  <path d="M 130 485 L 60 485" stroke="#7ee787" stroke-width="3" fill="none"/>
  <polygon points="65,480 60,490 65,490" fill="#7ee787"/>
  
  <path d="M 650 485 L 700 485" stroke="#f78166" stroke-width="3" fill="none"/>
  <rect x="705" y="470" width="50" height="25" rx="5" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="730" y="493" font-size="8" font-weight="bold" fill="#f78166" text-anchor="middle">NO</text>
  
  <rect x="705" y="510" width="50" height="45" rx="8" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="730" y="532" font-size="8" font-weight="bold" fill="#f78166" text-anchor="middle">REWRITE</text>
  <text x="730" y="530" font-size="7" fill="#8b949e" text-anchor="middle">Find real</text>
  <text x="730" y="540" font-size="7" fill="#8b949e" text-anchor="middle">risk</text>
  <path d="M 730 505 L 730 535 L 380 535 L 380 420" stroke="#f78166" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  
  <path d="M 380 485 L 380 525" stroke="#7ee787" stroke-width="4" fill="none"/>
  
  <!-- SUCCESS node -->
  <rect x="200" y="530" width="360" height="65" rx="8" fill="#161b22" stroke="#7ee787" stroke-width="3"/>
  <text x="380" y="560" font-size="13" font-weight="bold" fill="#7ee787" text-anchor="middle">STOP CONDITION READY</text>
  <text x="380" y="578" font-size="8" fill="#8b949e" text-anchor="middle">Observable | Falsifiable | Targets real risk - Ship when it passes</text>
  
  <!-- Examples sidebar -->
  <rect x="10" y="10" width="160" height="560" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="90" y="35" font-size="10" font-weight="bold" fill="#58a6ff" text-anchor="middle">EXAMPLES</text>
  
  <text x="20" y="65" font-size="8" font-weight="bold" fill="#7ee787">GOOD</text>
  <text x="20" y="82" font-size="7" fill="#c9d1d9">Every claim has a source</text>
  <text x="20" y="96" font-size="7" fill="#c9d1d9">Every number traces to doc</text>
  <text x="20" y="110" font-size="7" fill="#c9d1d9">Ask explicit in first 2 lines</text>
  <text x="20" y="124" font-size="7" fill="#c9d1d9">2 unverified claims flagged</text>
  
  <text x="20" y="150" font-size="8" font-weight="bold" fill="#f78166">BAD</text>
  <text x="20" y="175" font-size="7" fill="#c9d1d9">Until it feels right</text>
  <text x="20" y="189" font-size="7" fill="#c9d1d9">Until I am confident</text>
  <text x="20" y="198" font-size="7" fill="#c9d1d9">Good tone</text>
  <text x="20" y="213" font-size="7" fill="#c9d1d9">High quality</text>
  
  <text x="20" y="245" font-size="8" font-weight="bold" fill="#58a6ff">BY WORK TYPE</text>
  <text x="20" y="265" font-size="7" fill="#c9d1d9">Status: numbers traced, ask explicit</text>
  <text x="20" y="278" font-size="7" fill="#c9d1d9">Email: one clear ask, actionable</text>
  <text x="20" y="291" font-size="7" fill="#c9d1d9">Brief: claims sourced, 2 unverified</text>
  <text x="20" y="304" font-size="7" fill="#c9d1d9">Summary: nothing missing, added</text>
  
  <text x="20" y="330" font-size="8" font-weight="bold" fill="#a371f7">CREATIVE?</text>
  <text x="20" y="350" font-size="7" fill="#c9d1d9">Time-box: 3 passes, decide</text>
  
  <text x="380" y="555" font-size="10" fill="#58a6ff" text-anchor="middle" font-weight="bold">Write the stop condition FIRST. Then run the prompt. Check like a checklist, not a vibe.</text>
</svg>