<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 900 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.3" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff" />
    </marker>
    <marker id="arrowheadPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a371f7" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="320" fill="#0d1117"/>
  
  <text x="450" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="22" font-weight="700" fill="white" text-anchor="middle">The Leverage Loop</text>
  
  <!-- Node positions: 5 nodes in horizontal flow with return arrow -->
  <!-- Node 1: CAPTURE -->
  <g id="node-capture">
    <rect x="30" y="80" width="150" height="90" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
    <text x="105" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">1. CAPTURE</text>
    <text x="105" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Dump messy notes,</text>
    <text x="105" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">bullets, transcripts</text>
    <text x="105" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#58a6ff" text-anchor="middle">→ Raw material</text>
  </g>
  
  <path d="M 180 145 Q 215 145 230 145" stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 2: STRUCTURE -->
  <g id="node-structure">
    <rect x="220" y="80" width="150" height="90" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="295" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">2. STRUCTURE</text>
    <text x="295" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Run prompt to</text>
    <text x="295" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">organize, draft,</text>
    <text x="295" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#58a6ff" text-anchor="middle">→ First draft</text>
  </g>
  
  <path d="M 370 145 Q 405 145 425 145" stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 3: JUDGMENT (center, highlighted) -->
  <g id="node-judgment">
    <rect x="415" y="65" width="170" height="130" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="3" filter="url(#glow)"/>
    <text x="500" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a371f7" text-anchor="middle">3. JUDGMENT</text>
    <text x="500" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">YOU mark what's</text>
    <text x="500" y="130" font-family="system-ui, sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">wrong, missing,</text>
    <text x="500" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">off-voice</text>
    <text x="500" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a371f7" text-anchor="middle">→ Feedback list</text>
    <text x="500" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff" text-anchor="middle">🔑 The key step</text>
  </g>
  
  <path d="M 585 145 Q 620 145 640 145" stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 4: RE-RUN -->
  <g id="node-rerun">
    <rect x="630" y="80" width="150" height="90" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="705" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">4. RE-RUN</text>
    <text x="705" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Feed judgment</text>
    <text x="705" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">back as next</text>
    <text x="705" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#58a6ff" text-anchor="middle">→ Refined draft</text>
  </g>
  
  <path d="M 780 145 Q 815 145 835 145" stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 5: REPEAT -->
  <g id="node-repeat">
    <rect x="825" y="80" width="130" height="90" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="890" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">5. REPEAT</text>
    <text x="890" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Until stop</text>
    <text x="890" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">condition passes</text>
    <text x="890" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#58a6ff" text-anchor="middle">→ Ship it</text>
  </g>
  
  <!-- Return arrow -->
  <path d="M 955 145 Q 975 145 975 110 Q 975 60 880 60 Q 450 60 80 60 Q 0 60 0 110 Q 0 160 30 160" 
        stroke="#a371f7" stroke-width="3" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  
  <text x="450" y="35" font-family="system-ui, sans-serif" font-size="12" fill="#a371f7" text-anchor="middle" font-weight="600">Next task → New loop begins</text>
  
  <!-- Stop Condition badge -->
  <rect x="580" y="40" width="260" height="35" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="710" y="63" font-family="system-ui, sans-serif" font-size="11" fill="#a371f7" text-anchor="middle" font-weight="600">🛑 Stop: "Ask explicit + every number traced"</text>
  
  <!-- Bottom tip -->
  <text x="450" y="295" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Typical: 2–4 loops per task  •  Stop condition = your finish line  •  Judgment is the product</text>
</svg>