<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a371f7" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="400" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="24" font-weight="700" fill="white" text-anchor="middle">The Leverage Loop</text>
  <text x="450" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="13" fill="#8b949e" text-anchor="middle">Capture → Structure → Judgment → Re-run → Repeat</text>
  
  <!-- Node positions: 5 nodes in a horizontal flow with curved return -->
  <!-- Node 1: CAPTURE (left) -->
  <g id="node-capture">
    <rect x="50" y="120" width="140" height="80" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
    <text x="120" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle" font-weight="600">1. CAPTURE</text>
    <text x="120" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Dump messy notes,</text>
    <text x="120" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">bullets, transcripts</text>
    <text x="120" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle" font-weight="500">→ Raw material</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 190 160 Q 230 160 250 160" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 2: STRUCTURE -->
  <g id="node-structure">
    <rect x="260" y="120" width="140" height="80" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="330" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle" font-weight="600">2. STRUCTURE</text>
    <text x="330" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Run prompt to</text>
    <text x="330" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">organize, draft,</text>
    <text x="330" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle" font-weight="500">→ First draft</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 400 160 Q 440 160 460 160" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 3: JUDGMENT (center, highlighted) -->
  <g id="node-judgment">
    <rect x="470" y="100" width="150" height="120" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="3" filter="url(#glow)"/>
    <text x="545" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a371f7" text-anchor="middle" font-weight="600">3. JUDGMENT</text>
    <text x="545" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">YOU mark what's</text>
    <text x="545" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">wrong, missing,</text>
    <text x="545" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">off-voice</text>
    <text x="545" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a371f7" text-anchor="middle" font-weight="500">→ Feedback list</text>
    <text x="545" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">🔑 The key step</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 620 160 Q 660 160 680 160" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 4: RE-RUN -->
  <g id="node-rerun">
    <rect x="690" y="120" width="140" height="80" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="760" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle" font-weight="600">4. RE-RUN</text>
    <text x="760" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Feed judgment back</text>
    <text x="760" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">as next prompt</text>
    <text x="760" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle" font-weight="500">→ Refined draft</text>
  </g>
  
  <!-- Arrow 4 -->
  <path d="M 830 160 Q 860 160 880 160" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Node 5: REPEAT (right) -->
  <g id="node-repeat">
    <rect x="890" y="120" width="110" height="80" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="945" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle" font-weight="600">5. REPEAT</text>
    <text x="945" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Until stop</text>
    <text x="945" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">condition passes</text>
    <text x="945" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle" font-weight="500">→ Ship it</text>
  </g>
  
  <!-- Return arrow (curved from REPEAT back to CAPTURE) -->
  <path d="M 1000 160 Q 1020 160 1020 120 Q 1020 80 900 80 Q 500 80 100 80 Q 0 80 0 120 Q 0 160 50 160" 
        stroke="#a371f7" stroke-width="2" fill="none" marker-end="url(#arrowhead-purple)" stroke-dasharray="8,4"/>
  
  <!-- Return label -->
  <text x="500" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a371f7" text-anchor="middle" font-weight="600">Next task → New loop begins</text>
  
  <!-- Stop Condition badge -->
  <rect x="620" y="50" width="220" height="35" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="730" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a371f7" text-anchor="middle" font-weight="600">🛑 Stop Condition: "Ask explicit + every number traced"</text>
  
  <!-- Rep count -->
  <text x="450" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Typical: 2–4 loops per task  •  Stop condition = your finish line  •  Judgment is the product</text>
</svg>