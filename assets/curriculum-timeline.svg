<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 580" preserveAspectRatio="xMidYMid meet">
  <rect width="1200" height="580" fill="#0d1117"/>
  
  <text x="600" y="35" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="26" font-weight="700" fill="white" text-anchor="middle">Your 10-Week Journey</text>
  <text x="600" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">
    4 modules • 4 tracks • 1 system that compounds
  </text>
  
  <path d="M 80 110 L 1120 110" stroke="#30363d" stroke-width="4" fill="none"/>
  
  <!-- Module 1: Weeks 1-2 -->
  <g>
    <rect x="80" y="70" width="250" height="120" rx="12" fill="#1a2a3a" stroke="#58a6ff" stroke-width="2"/>
    <text x="205" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">MODULE 1</text>
    <text x="205" y="112" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle" font-weight="600">FOUNDATIONS</text>
    <text x="205" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Weeks 1–2</text>
    <text x="205" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Leverage Map (20 min)</text>
    <text x="205" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Run Loop 3× (3×15 min)</text>
    <text x="205" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Checkpoint: Pass/Fail</text>
  </g>
  
  <!-- Module 2: Weeks 3-5 -->
  <g>
    <rect x="350" y="70" width="300" height="120" rx="12" fill="#1a2d1a" stroke="#7ee787" stroke-width="2"/>
    <text x="500" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">MODULE 2</text>
    <text x="500" y="112" font-family="system-ui, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle" font-weight="600">CORE PRACTICES</text>
    <text x="500" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Weeks 3–5</text>
    <text x="500" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Wk 3: 3 Stop Conditions</text>
    <text x="500" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Wk 4: Maker-Checker + 5 Prompts</text>
    <text x="500" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Wk 5: 1 Book Retrieval Log</text>
    <text x="500" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Checkpoint: Portfolio Review</text>
  </g>
  
  <!-- Module 3: Weeks 6-8 -->
  <g>
    <rect x="670" y="70" width="300" height="120" rx="12" fill="#2d1a16" stroke="#f78166" stroke-width="2"/>
    <text x="820" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">MODULE 3</text>
    <text x="820" y="112" font-family="system-ui, sans-serif" font-size="13" fill="#f78166" text-anchor="middle" font-weight="600">YOUR TRACK</text>
    <text x="820" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Weeks 6–8 (Pick ONE)</text>
    <text x="820" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Manager: Decision Loop</text>
    <text x="820" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Writer: Draft→Edit→Publish</text>
    <text x="820" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Operator: Status→Follow-up→Handoff</text>
    <text x="820" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Knowledge Worker: Research→Brief</text>
  </g>
  
  <!-- Module 4: Ongoing -->
  <g>
    <rect x="990" y="70" width="200" height="120" rx="12" fill="#1d162d" stroke="#a371f7" stroke-width="2"/>
    <text x="1090" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">MODULE 4</text>
    <text x="1090" y="112" font-family="system-ui, sans-serif" font-size="13" fill="#a371f7" text-anchor="middle" font-weight="600">MASTERY</text>
    <text x="1090" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Ongoing</text>
    <text x="1090" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Advanced Prompts</text>
    <text x="1090" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Teach the Loop</text>
    <text x="1090" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">▸ Monthly Deep-Dive</text>
  </g>
  
  <!-- Milestone markers on timeline -->
  <circle cx="205" cy="110" r="10" fill="#58a6ff" stroke="white" stroke-width="2"/>
  <text x="205" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle" font-weight="600">✅ Checkpoint 1</text>
  <circle cx="500" cy="110" r="10" fill="#7ee787" stroke="white" stroke-width="2"/>
  <text x="500" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787" text-anchor="middle" font-weight="600">✅ Checkpoint 2</text>
  <circle cx="820" cy="110" r="10" fill="#f78166" stroke="white" stroke-width="2"/>
  <text x="820" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#f78166" text-anchor="middle" font-weight="600">✅ Track Done</text>
  <circle cx="1090" cy="110" r="10" fill="#a371f7" stroke="white" stroke-width="2"/>
  <text x="1090" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#a371f7" text-anchor="middle" font-weight="600">🏆 Mastery</text>
  
  <!-- Week markers -->
  <g font-family="system-ui, sans-serif" font-size="9" fill="#484f58">
    <text x="120" y="230" text-anchor="middle">Wk 1</text>
    <text x="180" y="230" text-anchor="middle">Wk 2</text>
    <text x="310" y="230" text-anchor="middle">Wk 3</text>
    <text x="370" y="230" text-anchor="middle">Wk 4</text>
    <text x="430" y="230" text-anchor="middle">Wk 4</text>
    <text x="490" y="230" text-anchor="middle">Wk 5</text>
    <text x="550" y="230" text-anchor="middle">Wk 6</text>
    <text x="610" y="230" text-anchor="middle">Wk 7</text>
    <text x="670" y="230" text-anchor="middle">Wk 7</text>
    <text x="730" y="230" text-anchor="middle">Wk 8</text>
    <text x="850" y="230" text-anchor="middle">Wk 9+</text>
  </g>
  
  <!-- Track selector visual -->
  <g>
    <text x="600" y="260" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">Pick Your Track (Week 6)</text>
    
    <rect x="130" y="280" width="240" height="180" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="250" y="310" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#58a6ff" text-anchor="middle">🎯 MANAGER</text>
    <text x="250" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Maker-Checker + Stop Conditions</text>
    <text x="250" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">Decision Loop on real decisions</text>
    <text x="250" y="368" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">2 decisions + retro</text>
    <text x="250" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Guide: Maker-Checker, Stop Conditions</text>
    
    <rect x="390" y="280" width="240" height="180" rx="12" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
    <text x="510" y="310" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#7ee787">✍️ WRITER</text>
    <text x="510" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Loop Prompting + Recurring Prompts</text>
    <text x="510" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">Draft → Edit → Publish pipeline</text>
    <text x="510" y="368" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">2 pieces + retro</text>
    <text x="510" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">Guide: Loop Prompting, Recurring Prompts</text>
    
    <rect x="630" y="280" width="240" height="180" rx="12" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="750" y="310" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f78166">⚙️ OPERATOR</text>
    <text x="750" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Stop Conditions + Recurring Prompts</text>
    <text x="750" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">Status → Follow-up → Handoff</text>
    <text x="750" y="368" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">2 weeks + retro</text>
    <text x="750" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#f78166" text-anchor="middle">Guide: Stop Conditions, Recurring Prompts</text>
    
    <rect x="870" y="280" width="240" height="180" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="990" y="310" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#a371f7">🔍 KNOWLEDGE WORKER</text>
    <text x="990" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Loop Prompting + Learning Paths</text>
    <text x="990" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">Research → Synthesis → Brief</text>
    <text x="990" y="368" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9" text-anchor="middle">2 briefs + retro</text>
    <text x="990" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#a371f7" text-anchor="middle">Guide: Loop Prompting, Learning Paths</text>
  </g>
  
  <text x="600" y="550" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">
    Rule of One: Pick ONE track. Finish it. Then add another. The lead carries 80% of the impact.
  </text>
</svg>