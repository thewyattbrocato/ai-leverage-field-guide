<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <!-- Background -->
  <rect width="1200" height="200" fill="#0d1117"/>
  
  <!-- Gradient accent line -->
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Main title -->
  <text x="600" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="48" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-0.5px">
    AI Leverage Field Guide
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="130" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="20" font-weight="400" fill="#8b949e" text-anchor="middle">
    Practical AI leverage for working professionals. Not engineers. Not hype.
  </text>
  
  <!-- Tagline -->
  <text x="600" y="158" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="16" font-weight="600" fill="url(#textGradient)" text-anchor="middle">
    More leverage, not more AI.
  </text>
  
  <!-- Bottom accent line -->
  <rect x="0" y="196" width="1200" height="4" fill="url(#accent)"/>
</svg>