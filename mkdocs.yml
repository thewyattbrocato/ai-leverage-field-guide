site_name: AI Leverage Field Guide
site_description: Practical AI leverage for working professionals — no hype, no courses, no tool-collecting.
site_author: Wyatt Brocato
repo_url: https://github.com/wyattbrocato/ai-leverage-field-guide
repo_name: wyattbrocato/ai-leverage-field-guide
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Guides:
      - Loop Prompting: guides/loop-prompting.md
      - Stop Conditions: guides/stop-conditions.md
      - Maker-Checker: guides/maker-checker.md
      - Recurring Prompts: guides/recurring-prompts.md
